name: Simulated traffic run
on:
  push:
    branches: [main]
    paths: ["sim/queue.json"]
  workflow_dispatch:
    inputs:
      run_id: { description: "Run id (e.g. R010)", required: true }
      sessions: { description: "Number of sessions", default: "1000" }
      seed: { description: "Random seed", default: "1" }
permissions:
  contents: write
concurrency:
  group: traffic
  cancel-in-progress: false
jobs:
  traffic:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Read run request
        id: req
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run_id=${{ inputs.run_id }}" >> $GITHUB_OUTPUT
            echo "sessions=${{ inputs.sessions }}" >> $GITHUB_OUTPUT
            echo "seed=${{ inputs.seed }}" >> $GITHUB_OUTPUT
            echo "concurrency=16" >> $GITHUB_OUTPUT
          else
            for k in run_id sessions seed concurrency; do echo "$k=$(jq -r .$k sim/queue.json)" >> $GITHUB_OUTPUT; done
          fi
      - name: Skip empty request
        if: steps.req.outputs.run_id == '' || steps.req.outputs.sessions == '0'
        run: echo "No run requested" && exit 0
      - uses: actions/setup-node@v4
        if: steps.req.outputs.run_id != '' && steps.req.outputs.sessions != '0'
        with: { node-version: 22 }
      - name: Install (packages must be >= 3 days old)
        if: steps.req.outputs.run_id != '' && steps.req.outputs.sessions != '0'
        run: |
          npm install --no-audit --no-fund --before="$(date -u -d '3 days ago' +%Y-%m-%dT%H:%M:%SZ)"
          npx playwright install --with-deps chromium
      - name: Wait until live site serves the committed config
        if: steps.req.outputs.run_id != '' && steps.req.outputs.sessions != '0'
        run: |
          for f in site-config experiments; do
            want=$(jq -cS . site/config/$f.json)
            for i in $(seq 1 60); do
              got=$(curl -fsS "https://crole-gregersen.github.io/autocro/config/$f.json?b=$RANDOM" | jq -cS . || true)
              [ "$got" = "$want" ] && echo "$f live" && break
              sleep 10
            done
            [ "$got" = "$want" ] || { echo "Live $f does not match commit"; exit 1; }
          done
      - name: Run simulated shoppers against live site
        if: steps.req.outputs.run_id != '' && steps.req.outputs.sessions != '0'
        run: |
          node sim/run.js --base https://crole-gregersen.github.io/autocro --sessions ${{ steps.req.outputs.sessions }} \
            --concurrency ${{ steps.req.outputs.concurrency }} --seed ${{ steps.req.outputs.seed }} --run ${{ steps.req.outputs.run_id }} --dwell-ms $(jq -r '.dwell_ms // 0' sim/queue.json) $( [ "$(jq -r '.ga_audit // false' sim/queue.json)" = true ] && echo '--ga-audit 1' )
          gzip -9f data/events/${{ steps.req.outputs.run_id }}.jsonl sim/sealed/truth/${{ steps.req.outputs.run_id }}.jsonl
      - name: Rebuild engine-room dashboard
        if: steps.req.outputs.run_id != '' && steps.req.outputs.sessions != '0'
        run: python3 dashboard/build.py
      - name: Commit event log
        if: steps.req.outputs.run_id != '' && steps.req.outputs.sessions != '0'
        run: |
          git config user.name "AutoCRO traffic bot"
          git config user.email "actions@github.com"
          git add data/events sim/sealed/truth reports site/engine-room dashboard/dist
          git commit -m "Traffic run ${{ steps.req.outputs.run_id }} (${{ steps.req.outputs.sessions }} sessions)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
